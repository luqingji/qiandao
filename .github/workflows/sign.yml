name: 论坛自动签到

on:
  schedule:
    # 北京时间 8:00 = UTC 时间 0:00
    - cron: '0 0 * * *'
  workflow_dispatch:  # 允许手动触发运行

jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 执行签到
        env:
          FORUM_ACCOUNTS: ${{ secrets.FORUM_ACCOUNTS }}
        run: python sign.py
